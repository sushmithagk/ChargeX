name: chargex
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0' # Updated SDK constraint

dependencies:
  flutter:
    sdk: flutter

  # --- ALL YOUR PROJECT PACKAGES GO HERE ---

  # Firebase
  firebase_core: ^3.1.0        # Core Firebase functions
  firebase_auth: ^5.1.0        # For user authentication
  cloud_firestore: ^5.0.1    # For the Firestore database
  google_sign_in: ^6.2.1     # For Google Sign-in

  # Services
  geolocator: ^12.0.0          # To get the user's GPS location
  provider: ^6.1.2             # To manage our services

  # Icons
  cupertino_icons: ^1.0.8
  # --- End of packages ---

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

