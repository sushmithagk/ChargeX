name: chargex
description: "An EV charging and trip planning Flutter app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # core
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.0          # keep your http version
  intl: ^0.18.0
  url_launcher: ^6.3.0

  # firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1

  # location & maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.14.0
  geocoding: ^2.1.0

  # IMPORTANT: use v2.x of flutter_polyline_points (matches your code)
  flutter_polyline_points: ^2.1.0

  # UI
  flutter_spinkit: ^5.2.0
  animations: ^2.0.10
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/google_logo.png
    - .env
